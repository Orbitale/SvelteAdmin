name: CI

on:
  push:
    branches: ['*']

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

concurrency:
  group: 'ci'
  cancel-in-progress: true

jobs:
  ci-tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version:
          - 22.x
          - 24.x
          - 26.x

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/setup@v1
        with:
          version: 12
          runtime: node@${{ matrix.node-version }}
          cache: true

      - run: pnpm install --frozen-lockfile

      - name: 🖌 Lint
        run: pnpm run lint

      - name: 🔬 Unit tests
        run: pnpm run test:unit --run

      - name: 🏗️ Build
        run: pnpm run build
